name: cardioscope
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.26
  - pandas>=2.0
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - seaborn>=0.13
  - scipy>=1.12
  - jupyter
  - ipykernel
  - pip
  - pip:
    - torch>=2.2.0
    - onnx>=1.16.0
    - onnxruntime>=1.17.0
    - shap>=0.45.0
    - lightgbm>=4.3.0
    - xgboost>=2.0.0
    - fastapi>=0.110.0
    - uvicorn>=0.29.0
    - python-dotenv>=1.0.0
    - joblib>=1.3.0
    - skl2onnx>=1.16.0
